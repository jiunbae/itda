<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itda</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="files.css">
<link rel="stylesheet" href="help.css">
<script src="icons.js"></script>
<script src="i18n.js"></script>
<script src="locales/ko.js"></script>
<script src="locales/en.js"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <div class="brand-text"><b>Itda</b><small data-i18n="brand.tagline"></small></div>
    </div>
    <nav id="nav" class="nav" data-i18n-attr="aria-label:nav.label"></nav>
    <div class="nav nav-bottom">
      <button class="nav-item nav-update" id="nav-update" data-i18n-attr="aria-label:nav.update" data-page="settings" hidden><span class="i">&#xE896;</span><span class="label" data-i18n="nav.update"></span></button>
      <button class="nav-item" data-page="help" data-i18n-attr="aria-label:nav.help;title:nav.help"><span class="i">&#xE897;</span><span class="label" data-i18n="nav.help"></span></button>
      <button class="nav-item" data-page="settings" data-i18n-attr="aria-label:nav.settings;title:nav.settings"><span class="i">&#xE713;</span><span class="label" data-i18n="nav.settings"></span></button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <h1 id="title"></h1>
      <div class="search">
        <span class="i">&#xE721;</span>
        <input id="search" type="text" autocomplete="off" spellcheck="false">
        <kbd>Ctrl F</kbd>
      </div>
      <div class="seg" id="viewToggle" role="group" data-i18n-attr="aria-label:top.viewToggle">
        <button data-view="grid" data-i18n-attr="title:top.view.grid"><span class="i">&#xF0E2;</span></button>
        <button data-view="list" data-i18n-attr="title:top.view.list"><span class="i">&#xE8FD;</span></button>
      </div>
      <button class="btn primary" id="newBtn"><span class="i">&#xE710;</span><span class="label-text"></span></button>
    </header>
    <section id="content" class="content" tabindex="-1"></section>
  </main>
</div>
<div id="modals"></div>
<div id="ctx" class="ctx" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<link rel="stylesheet" href="hp-setup.css">
<script src="hp-setup.js"></script>
<link rel="stylesheet" href="remote-setup.css">
<script src="remote-setup.js"></script>
<script src="app.js"></script>
<script src="files.js"></script>
<script src="help.js"></script>
</body>
</html>
