<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#26255f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Itda">
<title>Itda</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="viewer.css">
<script src="i18n.js"></script>
<script src="locales/ko.js"></script>
<script src="locales/en.js"></script>
</head>
<body>
<main id="login" class="screen center" hidden>
  <div class="login-card">
    <img src="icon.svg" alt="" class="login-logo">
    <h1>Itda</h1>
    <p id="loginNote" class="note" role="status" hidden></p>
    <p class="muted" data-i18n-html="viewer.login.intro"></p>
    <form id="loginForm" autocomplete="off">
      <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" data-i18n-attr="placeholder:viewer.login.pinPlaceholder" aria-label="PIN" required>
      <button class="primary" type="submit" data-i18n="viewer.login.submit"></button>
    </form>
    <p id="loginError" class="error" role="alert"></p>
    <label class="lang" hidden><select data-i18n-attr="aria-label:viewer.lang.label"><option value="auto" data-i18n="lang.auto"></option><option value="ko" data-i18n="lang.ko"></option><option value="en" data-i18n="lang.en"></option></select></label>
  </div>
</main>

<main id="list" class="screen" hidden>
  <header class="bar">
    <div class="brand"><img src="icon.svg" alt=""><b>Itda</b></div>
    <button id="install" class="ghost text" hidden data-i18n="viewer.list.install"></button>
    <button id="refresh" class="ghost" data-i18n-attr="title:viewer.list.refresh;aria-label:viewer.list.refresh"></button>
    <label class="lang" hidden><select data-i18n-attr="aria-label:viewer.lang.label"><option value="auto" data-i18n="lang.auto"></option><option value="ko" data-i18n="lang.ko"></option><option value="en" data-i18n="lang.en"></option></select></label>
    <button id="logout" class="ghost text" data-i18n="viewer.list.logout"></button>
  </header>
  <div id="hint" class="hint" hidden></div>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="hosts" aria-selected="true" data-i18n="viewer.list.tabHosts"></button>
    <button role="tab" data-tab="accounts" aria-selected="false" data-i18n="viewer.list.tabAccounts"></button>
  </div>
  <section id="hosts" class="hosts"></section>
  <section id="accounts" class="accounts" hidden></section>
</main>

<div id="editor" class="editor" hidden role="dialog" aria-modal="true" aria-labelledby="edTitle">
  <form id="edForm" class="ed-card" autocomplete="off"></form>
</div>

<main id="view" class="screen" hidden>
  <div id="screen"></div>
  <nav id="tools" class="tools" data-i18n-attr="aria-label:viewer.tools"></nav>
  <div id="sheet" class="sheet" hidden></div>
  <div id="status" class="status" hidden></div>
  <textarea id="kbd" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" data-i18n-attr="aria-label:viewer.kbd"></textarea>
</main>
<div id="toast" class="toast" hidden></div>
<script type="module" src="novnc.min.js"></script>
<link rel="stylesheet" href="hp-setup.css">
<script src="hp-setup.js"></script>
<script type="module" src="viewer.js"></script>
</body>
</html>
