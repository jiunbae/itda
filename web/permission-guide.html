<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title data-i18n="permGuide.title"></title><link rel="stylesheet" href="permission-guide.css"><script src="i18n.js"></script><script src="locales/ko.js"></script><script src="locales/en.js"></script>
<body><main>
<p class="step" id="step"></p>
<h1 id="title"></h1>
<p class="lead" id="lead"></p>
<div class="pull"><span class="arrow" id="arrow" aria-hidden="true">←</span><div><b id="switch-line" data-i18n-html="permGuide.switchLine"></b><span data-i18n="permGuide.dragHint"></span></div></div>
<button class="app" id="app" data-i18n-attr="aria-label:permGuide.app.label;title:permGuide.app.title"><img src="icon.svg" alt="" draggable="false"><b>Itda</b><small id="path"></small></button>
<ol class="notes">
<li data-i18n="permGuide.note.auth"></li>
<li data-i18n="permGuide.note.reopen"></li>
</ol>
<details id="stale"><summary data-i18n="permGuide.stale.q"></summary><p data-i18n-html="permGuide.stale.a"></p><div class="row"><button data-act="reveal" data-i18n="perm.reveal"></button></div></details>
<details><summary data-i18n="permGuide.drag.q"></summary><p data-i18n-html="permGuide.drag.a"></p><div class="row"><button data-act="reveal" data-i18n="perm.reveal"></button><button data-act="copy" data-i18n="perm.copy"></button></div></details>
<p class="state" id="state" role="status" aria-live="polite"></p>
<div class="done" id="done" hidden><span>✓</span><b id="done-text"></b></div>
</main><script src="permission-guide.js"></script></body></html>
