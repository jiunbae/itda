<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title data-i18n="perm.title"></title><link rel="stylesheet" href="permissions.css"><script src="i18n.js"></script><script src="locales/ko.js"></script><script src="locales/en.js"></script>
<body><main>
<header><img src="icon.svg" alt=""><div><p class="eyebrow" data-i18n="perm.eyebrow"></p><h1></h1></div></header>
<p class="intro"></p>
<p class="progress" role="status" aria-live="polite"></p>
<p class="hp-state" hidden></p>
<section class="permission" data-permission="access"><div class="heading"><span class="step">1</span><h2 data-i18n="perm.access.title"></h2><span class="badge"></span></div><p data-i18n="perm.access.desc"></p><button data-request="access" data-i18n="perm.access.open"></button></section>
<section class="permission" data-permission="screen"><div class="heading"><span class="step">2</span><h2 data-i18n="perm.screen.title"></h2><span class="badge"></span></div><p data-i18n="perm.screen.desc"></p><button data-request="screen" data-i18n="perm.screen.open"></button></section>
<section class="instructions" hidden><strong id="next-step"></strong><p data-i18n-html="perm.instr"></p><button class="app-drag" data-i18n-attr="aria-label:perm.drag.label;title:perm.drag.title"><img src="icon.svg" alt="" draggable="false"><span><b>Itda</b><small data-i18n="perm.drag.hint"></small></span><span aria-hidden="true">↗</span></button><p class="restart-note" data-i18n="perm.restartNote"></p><details><summary data-i18n="perm.notListed.q"></summary><p data-i18n="perm.notListed.a"></p><div class="alternatives"><button data-action="reveal" data-i18n="perm.reveal"></button><button data-action="copy"></button></div><p class="app-path"></p></details></section>
<section class="recovery" hidden><h2></h2><p class="recovery-message"></p><button data-action="restart" data-i18n="perm.restart"></button><p class="restart-impact" data-i18n="perm.restartImpact"></p><details><summary data-i18n="perm.stale.q"></summary><p data-i18n="perm.stale.a"></p><ol><li data-i18n-html="perm.stale.1"></li><li data-i18n="perm.stale.2"></li><li data-i18n-html="perm.stale.3"></li><li data-i18n="perm.stale.4"></li></ol><button class="secondary" data-action="reveal" data-i18n="perm.reveal"></button><p class="current-app"></p></details></section>
<details class="reminder"><summary data-i18n="perm.reminder.q"></summary><p data-i18n-html="perm.reminder.p1"></p><p data-i18n-html="perm.reminder.p2"></p></details>
<p class="error" role="alert" hidden></p><footer><p data-i18n-html="perm.footer"></p><div><button class="secondary" data-action="status" data-i18n="perm.recheck"></button><button class="secondary" data-action="close"></button></div></footer>
</main><script src="permissions.js"></script></body></html>
