name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Raw decoder regression
        run: node scripts/raw-decoder-test.mjs
      - name: Test
        run: cargo test --release
      - name: Build
        shell: pwsh
        run: ./scripts/windows-release.ps1
      - name: Size
        shell: pwsh
        run: "'itda.exe: {0:N2} MB' -f ((Get-Item target/release/itda.exe).Length / 1MB)"
      - uses: actions/upload-artifact@v4
        with:
          name: itda-windows-x64
          path: target/release/itda.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Raw decoder regression
        run: node scripts/raw-decoder-test.mjs
      - name: Test
        run: cargo test --release
      - name: Bundle (universal)
        run: scripts/macos-bundle.sh universal
      - uses: actions/upload-artifact@v4
        with:
          name: itda-macos-universal
          path: dist/Itda-macos-universal.zip

  windows-file-ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: npm install --no-save --package-lock=false playwright
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Explorer and Finder frontend regression
        run: node scripts/files-windows-e2e.mjs
        env:
          SCREENSHOT_DIR: test-artifacts/file-ui
      - name: Tabs on different devices
        run: node scripts/files-tabs-e2e.mjs
      - name: Permission helper regression
        run: node scripts/permissions-e2e.mjs
        env:
          SCREENSHOT_DIR: test-artifacts/permissions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: permission-helper-ui
          path: test-artifacts/permissions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-file-ui
          path: test-artifacts/file-ui
