name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Raw decoder regression
        run: node scripts/raw-decoder-test.mjs
      - name: Test
        run: cargo test --release
      - name: Build
        shell: pwsh
        run: ./scripts/windows-release.ps1
      - name: Version and resources
        shell: pwsh
        run: ./scripts/windows-version-check.ps1
      - name: Size
        shell: pwsh
        run: "'itda.exe: {0:N2} MB' -f ((Get-Item target/release/itda.exe).Length / 1MB)"
      - uses: actions/upload-artifact@v4
        with:
          name: itda-windows-x64
          path: target/release/itda.exe

  macos:
    runs-on: macos-latest
    env:
      # A step's `if` cannot read secrets; these say whether they are configured.
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12_B64 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_P8_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Raw decoder regression
        run: node scripts/raw-decoder-test.mjs
      - name: Performance measurement probe regression
        run: node scripts/hp-performance-probe-test.mjs
      - name: Test
        run: cargo test --release
      - name: Signing keychain
        id: sign
        env:
          P12: ${{ secrets.MACOS_CERT_P12_B64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        if: env.HAS_SIGNING == 'true'
        run: |
          KC="$RUNNER_TEMP/sign.keychain-db"; KPW=$(openssl rand -hex 16)
          security create-keychain -p "$KPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KPW" "$KC"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "keychain=$KC" >> "$GITHUB_OUTPUT"
      - name: Notary key
        id: notary
        env:
          P8: ${{ secrets.NOTARY_KEY_P8_B64 }}
        # Notarizing takes minutes: only the main builds that become releases.
        if: env.HAS_NOTARY == 'true' && steps.sign.outputs.keychain != '' && github.event_name == 'push'
        run: |
          printf '%s' "$P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "key=$RUNNER_TEMP/notary.p8" >> "$GITHUB_OUTPUT"
      - name: Bundle (universal)
        env:
          MACOS_SIGN_IDENTITY: "${{ steps.sign.outputs.keychain && 'Developer ID Application: Jiun Bae (728FW73BS8)' || '' }}"
          MACOS_KEYCHAIN: ${{ steps.sign.outputs.keychain }}
          NOTARY_KEY: ${{ steps.notary.outputs.key }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/macos-bundle.sh universal
      - name: macOS launch compatibility (both architectures)
        run: python3 scripts/check-macos-compat.py dist/Itda.app/Contents/MacOS/itda --universal
      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8"
          [ -f "$RUNNER_TEMP/sign.keychain-db" ] && security delete-keychain "$RUNNER_TEMP/sign.keychain-db" || true
      - uses: actions/upload-artifact@v4
        with:
          name: itda-macos-universal
          path: dist/Itda-macos-universal.zip

  windows-file-ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: npm install --no-save --package-lock=false playwright
      - name: Install Chromium
        run: npx playwright install chromium
      - name: No secure-context-only APIs (web viewer runs on plain HTTP)
        run: node scripts/secure-context-check.mjs
      - name: Explorer and Finder frontend regression
        run: node scripts/files-windows-e2e.mjs
        env:
          SCREENSHOT_DIR: test-artifacts/file-ui
      - name: Tabs on different devices
        run: node scripts/files-tabs-e2e.mjs
      - name: Background transfer UI (closed-window state, recovery and ordering)
        run: node scripts/files-background-e2e.mjs
      - name: Quit and update guard while transfers run
        run: node scripts/quit-guard-e2e.mjs
      - name: File window without a device (Windows places, This PC)
        run: node scripts/files-network-local-e2e.mjs
      - name: Self-update UI
        run: node scripts/update-e2e.mjs
      - name: SSH remote setup UI
        run: node scripts/remote-setup-e2e.mjs
      - name: Permission helper regression
        run: node scripts/permissions-e2e.mjs
        env:
          SCREENSHOT_DIR: test-artifacts/permissions
      - name: Connection editor (groups, suggestions, OS badges, HP block)
        run: node scripts/editor-e2e.mjs
      - name: Monitors and pointer batching
        run: node scripts/monitors-e2e.mjs
      - name: Viewer mode diagnostics and drop/reconnect ownership
        run: node scripts/viewer-mode-e2e.mjs
      - name: Device card and list action names, keyboard
        run: node scripts/device-actions-a11y-e2e.mjs
      - name: Phone web viewer (sign-in, lockout, expiry, login fix, toolbar)
        run: node scripts/viewer-phone-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: permission-helper-ui
          path: test-artifacts/permissions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-file-ui
          path: test-artifacts/file-ui
