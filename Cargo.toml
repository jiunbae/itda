[package]
name = "itda"
version = "1.0.11"
edition = "2021"
description = "Itda (잇다): remote desktop and file access for Windows and macOS, with a browser viewer for phones and tablets."
license = "MIT"
repository = "https://github.com/jiunbae/itda"
homepage = "https://jiun.dev/itda/"

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
des = "0.8"
aes = "0.8"
md-5 = "0.10"
num-bigint = "0.4"
getrandom = { version = "0.2", features = ["std"] }
wry = "0.57.0"
serde_json = "1.0.154"
sha2 = "0.10"
zeroize = "1.9"
serde = { version = "1.0.229", features = ["derive"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
ironrdp-blocking = "0.10"
ironrdp-connector = "0.10"
ironrdp-session = "0.11"
ironrdp-graphics = "0.9"
ironrdp-pdu = "0.9"
ironrdp-dvc = "0.8"
ironrdp-displaycontrol = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
unicode-normalization = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }

[target.'cfg(target_os = "macos")'.dependencies]
# High-performance mode: hardware H.264 (VideoToolbox) for RFB encoding 50.
objc2-video-toolbox = { version = "0.3.2", default-features = false, features = ["std", "VTCompressionSession", "VTSession", "VTCompressionProperties", "VTVideoEncoderList", "VTErrors", "objc2-core-media", "objc2-core-video", "block2"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMSampleBuffer", "objc2-core-video", "CMBlockBuffer", "CMFormatDescription", "CMTime", "CMBase", "CMSync", "objc2-core-video"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn", "CVPixelBufferPool", "objc2-io-surface"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFDictionary", "CFNumber", "CFString", "CFBase", "CFArray"] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "dispatch2", "objc2-core-media", "objc2-core-graphics", "SCStream", "SCShareableContent", "SCError"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation", "CGDirectDisplay", "CGError", "CGWindow", "CGSession"] }
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }
tao = "0.34"
muda = "0.17"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSObject", "NSOperation", "NSProcessInfo", "NSString", "NSURL", "NSValue"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSApplication", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSFilePromiseProvider", "NSGraphicsContext", "NSImage", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSRunningApplication", "NSView", "NSWindow", "NSWorkspace", "libc"] }

# Desktop Duplication (Share this PC); the same version ironrdp's sspi already builds.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = ["Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com_Marshal", "Win32_System_Com_StructuredStorage", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_DataExchange", "Win32_UI_Shell_Common", "Win32_Media_MediaFoundation"]

# For #[implement] (COM objects for dragging files out to Explorer).
[target.'cfg(windows)'.dependencies.windows-core]
version = "0.62"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_System_Shutdown",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_Dns",
  "Win32_Networking_WinSock",
  "Win32_Security_Credentials",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_IO",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_Ime",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Preview decoder failures are caught on their worker; abort would bypass catch_unwind.
panic = "unwind"
strip = true

# RDP login and protocol plumbing runs once per connection: favour size.
[profile.release.package]
sspi = { opt-level = "z" }
picky = { opt-level = "z" }
picky-krb = { opt-level = "z" }
picky-asn1-x509 = { opt-level = "z" }
picky-asn1-der = { opt-level = "z" }
rsa = { opt-level = "z" }
winscard = { opt-level = "z" }
cryptoki = { opt-level = "z" }
ironrdp-connector = { opt-level = "z" }
ironrdp-pdu = { opt-level = "z" }
rustls = { opt-level = "z" }
x509-cert = { opt-level = "z" }

[build-dependencies]
embed-resource = "3.0.12"

# winscard (via ironrdp-connector → sspi) forces flate2 onto C zlib; this copy doesn't.
[patch.crates-io]
winscard = { path = "vendor/winscard" }
